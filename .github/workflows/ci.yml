name: checks and package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: static checks
        run: python3 scripts/check.py
      - name: lint the helper (ruff - syntax, undefined names, unused imports)
        run: pip install -q ruff pytest pillow && ruff check livemap/contents/helper tests
      - name: tests (parsers against recorded fixtures; config, status, sources and version consistency)
        run: pytest -q tests
      - name: shell syntax
        run: bash -n livemap.sh && bash livemap.sh help >/dev/null
      - name: helper runs offline
        run: python3 livemap/contents/helper/livemap-helper.py status --offline | python3 -m json.tool >/dev/null
      - name: qmllint (advisory - the runner has no Plasma, so this cannot resolve the KDE types; it reports parse errors only)
        continue-on-error: true
        run: |
          sudo apt-get update >/dev/null 2>&1 || true
          sudo apt-get install -y qt6-declarative-dev-tools >/dev/null 2>&1 || { echo "qt6-declarative-dev-tools could not be installed"; exit 1; }
          lint=$(ls /usr/lib/qt6/bin/qmllint /usr/lib/x86_64-linux-gnu/qt6/bin/qmllint 2>/dev/null | head -1)
          [ -n "$lint" ] || { echo "qmllint not found after install"; exit 1; }
          "$lint" --version
          status=0
          for f in livemap/contents/ui/*.qml livemap-widget/contents/ui/*.qml; do
            if ! "$lint" "$f" >/tmp/lint.txt 2>&1; then
              if grep -qiE "syntax error|Expected token|Unexpected token|unterminated" /tmp/lint.txt; then echo "== $f"; grep -iE "syntax error|Expected token|Unexpected token|unterminated" /tmp/lint.txt; status=1; fi
            fi
          done
          exit $status
      - name: build livemap.zip
        run: scripts/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: livemap.zip
          path: livemap.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: scripts/package.sh
      - name: release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{p = ($2 == v)} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $v" > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            livemap.zip
            livemap-wallpaper-*.tar.gz
            livemap-widget-*.tar.gz
          body_path: notes.md
