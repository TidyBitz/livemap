name: checks and package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: static checks
        run: python3 scripts/check.py
      - name: lint the helper (ruff - syntax, undefined names, unused imports)
        run: pip install -q ruff pytest && ruff check livemap/contents/helper tests
      - name: tests (parsers against recorded fixtures; config, status, sources and version consistency)
        run: pytest -q tests
      - name: shell syntax
        run: bash -n livemap.sh && bash livemap.sh help >/dev/null
      - name: helper runs offline
        run: python3 livemap/contents/helper/livemap-helper.py status --offline | python3 -m json.tool >/dev/null
      - name: qmllint (syntax of every QML file; the KDE modules are not installed here, so only parse errors fail)
        run: |
          sudo apt-get update -q >/dev/null && sudo apt-get install -y -q qt6-declarative-dev-tools >/dev/null
          lint=$(ls /usr/lib/qt6/bin/qmllint /usr/lib/x86_64-linux-gnu/qt6/bin/qmllint 2>/dev/null | head -1)
          [ -n "$lint" ] || { echo "qmllint not found; skipping"; exit 0; }
          "$lint" --version
          status=0
          for f in livemap/contents/ui/*.qml livemap-widget/contents/ui/*.qml; do
            out=$("$lint" --json - "$f" 2>&1 || true)
            # only a parse error is ours to fix here; unresolved KDE types and imports are expected
            if echo "$out" | grep -q '"type": *"critical"'; then echo "$f"; echo "$out" | grep -B2 -A6 '"critical"'; status=1; fi
          done
          exit $status
      - name: build livemap.zip
        run: scripts/package.sh
      - uses: actions/upload-artifact@v6
        with:
          name: livemap.zip
          path: livemap.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: scripts/package.sh
      - name: release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{p = ($2 == v)} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $v" > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          files: livemap.zip
          body_path: notes.md
